name: Release

on:
  push:
    # Core releases only; the connector is tagged connectors/plc4x/vX.Y.Z.
    tags: [ "v*" ]

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Test before releasing
      run: go test -race -count=1 ./...

    # A tag with a pre-release suffix (v0.1.0-beta1) is published as a pre-release.
    # A release made on GitHub's release page also pushes its tag, which starts
    # this workflow: then the release already exists and is left as it is.
    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists (made on GitHub); leaving it as it is."
          exit 0
        fi
        prerelease=""
        case "$TAG" in *-*) prerelease="--prerelease" ;; esac
        gh release create "$TAG" --verify-tag --generate-notes --title "honeycomb $TAG" $prerelease

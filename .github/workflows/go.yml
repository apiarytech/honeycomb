name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Fail instead of silently downloading a newer toolchain, so each matrix
  # entry really tests the Go version it names.
  GOTOOLCHAIN: local
  # Tag values copy the mutex inside Tag (GetTag and friends return Tag by
  # value), which vet's copylocks check reports. Skip that check until the API
  # stops copying it; every other vet check runs.
  VET_FLAGS: -copylocks=false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        go:
          - '1.27.1' # Minimum version. Keep in sync with the go directive in go.mod.
          - 'stable'
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ${{ env.VET_FLAGS }} ./...

    - name: Test
      run: go test -v ./...

  # The PLC4X connector is its own module, so ./... from the root skips it.
  # PLC4X compiles every protocol driver; the first build takes several minutes.
  plc4x:
    name: PLC4X connector (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: connectors/plc4x

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        cache-dependency-path: connectors/plc4x/go.sum

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v -count=1 ./...

  lint-race:
    name: Format and race detector
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    # gofmt walks into connectors/plc4x too, so this covers both modules.
    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: Test with race detector
      run: go test -race -count=1 ./...

    # Race instrumentation makes PLC4X's generated BACnet package need about
    # 7.5 GB to compile, so compile one package at a time (-p 1) to stay within
    # the runner's memory.
    - name: Test the PLC4X connector with race detector
      working-directory: connectors/plc4x
      run: go test -p 1 -race -count=1 ./...

  raspberry-pi:
    name: Raspberry Pi (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PLC4X does not compile for 32-bit targets: it passes math.MaxInt64 as
        # an int (plc4go spi/codegen/fields/FieldReaderArray.go). Enable plc4x
        # on the 32-bit entries once PLC4X fixes that.
        include:
          - name: Pi Zero and Pi 1, 32-bit ARMv6
            goarch: arm
            goarm: '6'
            plc4x: false
          - name: Pi 2 and Pi 3, 32-bit ARMv7
            goarch: arm
            goarm: '7'
            plc4x: false
          - name: Pi 3, 4 and 5, 64-bit
            goarch: arm64
            goarm: ''
            plc4x: true
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    # QEMU runs the ARM test binaries on the x86 runner.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm,arm64

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ${{ env.VET_FLAGS }} ./...

    - name: Test
      run: go test -count=1 ./...

    - name: Build the PLC4X connector
      if: matrix.plc4x
      working-directory: connectors/plc4x
      run: go build -v ./...

    - name: Test the PLC4X connector
      if: matrix.plc4x
      working-directory: connectors/plc4x
      run: go test -count=1 ./...
